# SMSTPred analysis environment (Stages 1-5, 7 scripts and all figure/table builders).
#
#   make env                                   # = conda env create -f environment.yml -n smstpred
#   conda activate smstpred                    # the run_*.sh drivers use the active environment, else "smstpred"
#
# Versions are the ones the analyses were run and checked with (Python 3.12; a fresh clone plus this
# environment reproduces the figures/tables listed in REPRODUCING.md). pytorch resolves to a CPU or CUDA
# build automatically; GPU training/sweeps need a CUDA-enabled install.
#
# The MEME suite (STREME/FIMO), MMseqs2, HMMER and MAFFT are included (bioconda, the versions used). Not included:
# Foldseek (separate static binary, needed only for the bake-off baseline and the SaProt embeddings; `make tools`
# downloads it), PyMOL (only to re-render the structure snapshots) and the CLEAN and Horizyn checkouts used in Stage 6.
name: smstpred
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # core numerics / ML
  - numpy=2.1
  - pandas=2.2
  - scipy=1.15
  - scikit-learn=1.6
  - h5py=3.12
  - pytorch=2.8
  - xgboost=2.1
  - joblib
  - psutil
  - tqdm
  - requests
  # statistics / dimensionality reduction (statsmodels is pinned: scikit-posthocs 0.14 breaks with 0.15)
  - statsmodels=0.14
  - scikit-posthocs=0.14
  - umap-learn=0.5
  # figures and tables
  - matplotlib=3.10
  - pillow
  - lxml
  - cairosvg=2.9
  - rdkit=2024.03
  - gemmi=0.7
  # command-line tools used by Stages 2 (baselines) and 7 (motif discovery)
  - meme=5.5.9
  - mmseqs2=18.8cc5c
  - hmmer=3.4
  - mafft=7.525
  - pip
  - pip:
      - datamapplot==0.7.1
