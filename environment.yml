# SMSTPred analysis environment (Stages 1-5, 7 scripts and all figure/table builders).
#
#   conda env create -f environment.yml        # creates "classifier_env", the name the run_*.sh drivers activate
#   conda activate classifier_env
#
# Versions are the ones the analyses were run and checked with (Python 3.12; a fresh clone plus this
# environment reproduces the figures/tables listed in REPRODUCING.md). pytorch resolves to a CPU or CUDA
# build automatically; GPU training/sweeps need a CUDA-enabled install.
#
# Not included (separate installs, see data/README.md): MEME suite (STREME/FIMO), MMseqs2, Foldseek,
# HMMER/MAFFT (bake-off baselines), and the CLEAN and Horizyn checkouts used in Stage 6.
name: classifier_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  # core numerics / ML
  - numpy=2.1
  - pandas=2.2
  - scipy=1.15
  - scikit-learn=1.6
  - h5py=3.12
  - pytorch=2.8
  - xgboost=2.1
  - joblib
  - psutil
  - tqdm
  - requests
  # statistics / dimensionality reduction (statsmodels is pinned: scikit-posthocs 0.14 breaks with 0.15)
  - statsmodels=0.14
  - scikit-posthocs=0.14
  - umap-learn=0.5
  # figures and tables
  - matplotlib=3.10
  - pillow
  - lxml
  - cairosvg=2.9
  - rdkit=2024.03
  - gemmi=0.7
  - pip
  - pip:
      - datamapplot==0.7.1
