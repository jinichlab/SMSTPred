# The conda environment the Stage 6 CLEAN runs used (exported with `conda env export --no-builds`: versions only).
# It belongs to the CLEAN install, not to the repository's environment.yml. Create it with
#   bash workflow/setup_tools.sh --install clean      (this file = the conda part; the pinned pip packages are in requirements_clean.txt and go in with --no-deps,
#   because the exported pins do not resolve together, e.g. torchtext 0.18 wants torch 2.3 next to torch 2.7)
# then point CLEAN_APP_DIR at your CLEAN checkout and run the run_*.sh driver in this folder
# (CLEAN_ENV renames the environment). Model checkpoints come from the tool's own release.
name: clean
channels:
  - defaults
  - conda-forge
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - asttokens=3.0.0
  - bzip2=1.0.8
  - ca-certificates=2025.6.15
  - comm=0.2.2
