# The conda environment the Stage 6 CLEAN runs used (exported with `conda env export --no-builds`: versions only).
# It belongs to the CLEAN install, not to the repository's environment.yml. Create it with
#   conda env create -f environment_clean.yml
# then point CLEAN_APP_DIR at your CLEAN checkout and run the run_*.sh driver in this folder
# (CLEAN_ENV renames the environment). Model checkpoints come from the tool's own release.
