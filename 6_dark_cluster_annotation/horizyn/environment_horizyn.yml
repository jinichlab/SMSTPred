# The conda environment the Stage 6 Horizyn runs used (exported with `conda env export --no-builds`: versions only).
# It belongs to the Horizyn install, not to the repository's environment.yml. Create it with
#   bash workflow/setup_tools.sh --install horizyn      (this file = the conda part; the pinned pip packages are in requirements_horizyn.txt and go in with --no-deps,
#   because the exported pins do not resolve together, e.g. torchtext 0.18 wants torch 2.3 next to torch 2.7)
# then point HORIZYN_DIR at your Horizyn checkout and run the run_*.sh driver in this folder
# (HORIZYN_ENV renames the environment). Model checkpoints come from the tool's own release.
name: horizyn
channels:
  - defaults
  - conda-forge
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bzip2=1.0.8
  - ca-certificates=2026.8.13
  - ld_impl_linux-64=2.44
  - libexpat=2.8.4
  - libffi=3.4.8
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libnsl=2.0.0
  - libstdcxx=15.2.0
  - libuuid=1.41.5
  - libxcb=1.17.0
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.5.8
  - packaging=26.3
  - pip=26.2.1
  - pthread-stubs=0.3
  - python=3.10.21
  - readline=8.3
  - setuptools=83.0.0
  - sqlite=3.53.4
  - tk=8.6.15
  - wheel=0.47.0
  - xorg-libx11=1.8.13
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2025.1
  - xz=5.8.2
  - zlib=1.3.2
